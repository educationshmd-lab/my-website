<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روزنامة تقويم جمعية تعلَّم - فرع المدينة المنورة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--hd:#1e3a5f;--we:#f8fafc;--ac:#1e3a5f}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162032;--tx:#e8eef7;--mu:#94a3b8;--bd:#2a3850;--hd:#0f2747;--we:#1a263a;--ac:#5b8bd6}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#162032;--tx:#e8eef7;--mu:#94a3b8;--bd:#2a3850;--hd:#0f2747;--we:#1a263a;--ac:#5b8bd6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0}
nav,.seg{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
.tab,.seg button{border:1px solid var(--bd);background:var(--card);padding:7px 14px;border-radius:9px;cursor:pointer}
header .tab{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.tab.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
header .tab.on{background:#fff;color:var(--hd)}
main{max-width:1200px;margin:auto;padding:16px}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mu)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.month{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;overflow-x:auto}
.month h3{margin:0 0 8px;font-size:15px;text-align:center;background:#facc15;color:#1f2937;border-radius:7px;padding:5px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:3px}
.wd{font-size:11px;text-align:center;color:var(--mu);padding:2px 0}
.day{border:1px solid var(--bd);border-radius:6px;min-height:50px;padding:3px;background:var(--card);display:flex;flex-direction:column;gap:2px;cursor:default}
.day.we{background:var(--we)}
.day.today{outline:2px solid #ef4444}
.day b{font-size:14px;line-height:1}
.day small{font-size:10px;color:var(--mu);line-height:1}
.day .bars{display:flex;flex-direction:column;gap:2px;margin-top:auto}
.bars span{height:6px;border-radius:3px;display:block}
.pad{visibility:hidden}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0f172a;color:#fff;padding:8px 11px;border-radius:9px;font-size:13px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}
#tip div{margin-top:4px}#tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input[type=color]{width:52px;height:38px;padding:2px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.row>button{flex:0 0 auto;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:0;color:#fff;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 18px;border-radius:9px;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.del{background:#dc2626}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ev:last-child{border:0}.ev i{width:14px;height:14px;border-radius:4px;flex:none}.ev div{flex:1;min-width:180px}.ev small{color:var(--mu);display:block}
.lock{text-align:center;padding:30px;color:var(--mu)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 16px;border-radius:9px;display:none;z-index:60}
.bar0{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.legend i{font-style:normal}
.wrapx{overflow-x:auto}.mwrap{min-width:1180px}
.mrow{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;overflow:hidden}
.mlab{flex:0 0 130px;background:#facc15;color:#1f2937;font-weight:700;font-size:13px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.6}
.mlab small{font-weight:400;font-size:11px}
.cells{flex:1;display:grid;grid-template-columns:repeat(31,minmax(0,1fr))}
.c{display:flex;flex-direction:column;text-align:center;border-inline-start:1px solid var(--bd);min-width:0;cursor:default}
.c u{text-decoration:none;font-size:11px;background:#334155;color:#fff;padding:3px 0}
.c.we u{background:#b91c1c}
.c b{font-size:15px;padding:5px 0 1px}
.c i{font-style:normal;font-size:10px;color:var(--mu);padding-bottom:3px}
.c.we i{background:#fee2e2;color:#991b1b}.c.we b{color:#b91c1c}
.c.off{background:var(--we)}
.c.today b{outline:2px solid #ef4444;border-radius:5px;margin:3px 2px 0}
.c .bar{height:9px;margin:2px 1px;border-radius:2px;display:block}

:root{--bg:#eef4f2;--card:#fff;--tx:#1f2d2d;--mu:#5f7370;--bd:#dce6e3;--hd:#fff;--we:#f5f8f7;--ac:#0b6b6b;--gold:#e0b96a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a19;--card:#15282a;--tx:#e6f0ee;--mu:#9bb3af;--bd:#27403f;--hd:#102426;--we:#1a2f30;--ac:#2fa3a3}}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--card) 140%) fixed}
header{background:var(--hd);color:var(--ac);border-bottom:3px solid var(--gold);padding:12px 28px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.brand{display:flex;align-items:center;gap:16px}.brand img{height:54px;width:auto}
header h1{font-size:25px;color:var(--ac);margin:0}.sub{font-size:13px;color:var(--mu);margin-top:2px}
header .tab{background:#e8f1ef;color:#0b6b6b;border:1px solid var(--gold);font-weight:600}
header .tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) header .tab{background:#1a3436;color:#cfe9e6}}
.seg button.on{background:var(--ac);border-color:var(--ac)}
.mlab{background:#e8d3a0;color:#12403f}
.c u{background:var(--ac)}.c.we u{background:#b91c1c}
.mrow{border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.panel{border-top:4px solid var(--ac);border-radius:16px;box-shadow:0 6px 24px rgba(11,107,107,.08)}
.panel h2{color:var(--ac)}
.legend{color:var(--mu)}
.month h3{background:#e8d3a0;color:#12403f}
@page{size:A4 landscape;margin:8mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff}header nav,.bar0 .seg,.bar0 select,#print,#toast,#tip{display:none!important}
header{box-shadow:none;padding:6px 10px}main{padding:6px;max-width:none}
.months{grid-template-columns:repeat(3,1fr);gap:8px}.month{break-inside:avoid;padding:6px}
.mwrap{min-width:0}.wrapx{overflow:visible}.mrow{break-inside:avoid;margin-bottom:4px}}

:root{--hf:'Doran','Reem Kufi','Tajawal',sans-serif;--bf:'Alyamama','IBM Plex Sans Arabic','Tajawal',sans-serif}
body{font-family:var(--bf)}
h1,h2,h3,.mlab,.month h3{font-family:var(--hf)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:16px;overflow:auto}
.ov .box{background:var(--card);color:var(--tx);border-radius:16px;padding:20px;max-width:480px;width:100%;border-top:4px solid var(--ac);margin-top:8px}
.ov h2{margin:0 0 6px;color:var(--ac);font-size:18px}
.evp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.evp summary{cursor:pointer;font-weight:700;color:var(--ac);line-height:1.8;font-size:13px}
.evl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 14px;margin-top:8px}
.evi{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}
.evi input{width:18px;height:18px;flex:none;accent-color:var(--ac);padding:0;margin:0}
.evi i{width:12px;height:12px;border-radius:3px;flex:none}
.evi .evn{all:unset;display:block;cursor:pointer;color:var(--tx);font-weight:600;font-size:12px;line-height:1.5;text-decoration:underline dotted;text-underline-offset:4px}
.evi .evn:hover{color:var(--ac)}
.evi small{color:var(--mu);font-size:10px;display:block}
.evi.off .evn{opacity:.45;text-decoration:line-through}
@keyframes fl{0%,100%{box-shadow:none}25%,75%{box-shadow:0 0 0 3px #f59e0b,0 0 14px #f59e0b}}
.flash{animation:fl 2.2s;position:relative;z-index:2}

"]]},{"id":"t5","title":"ترشيح الطلاب – كامل القرآن (الفترة الثانية)","type":"ترشيح اختبارات تعلّم","color":"#0d9488","note":"20/7 – 12/8/1448 هـ","ranges":[["2026-12-29","2027-01-20"]]},{"id":"t6","title":"اختبار كامل القرآن (الفترة الثانية)","type":"اختبارات تعلّم","color":"#be185d","note":"25/8/1448 هـ","ranges":[["2027-02-02","2027-02-02"]]},{"id":"t7","title":"ترشيح الطلاب – كامل القرآن (الفترة الثالثة)","type":"ترشيح اختبارات تعلّم","color":"#0d9488","note":"13 – 20/10/1448 هـ","ranges":[["2027-03-21","2027-03-28"]]},{"id":"t8","title":"اختبار كامل القرآن (الفترة الثالثة)","type":"اختبارات تعلّم","color":"#be185d","note":"29/10/1448 هـ","ranges":[["2027-04-06","2027-04-06"]]},{"id":"t9","title":"ترشيح الطلاب – اختبارات الأجزاء (الفترة الثانية)","type":"ترشيح اختبارات تعلّم","color":"#0d9488","note":"13 – 20/10/1448 هـ","ranges":[["2027-03-21","2027-03-28"]]},{"id":"t10","title":"اختبارات الأجزاء (الفترة الثانية)","type":"اختبارات تعلّم","color":"#be185d","note":"5/11/1448 هـ","ranges":[["2027-04-12","2027-04-12"]]}]}</script>
<script>
let S=JSON.parse(document.getElementById('data').textContent),mode='c',lay='cards',yh='',hid=new Set(),gi={},evOpen=true,yr=String(Math.min(2030,Math.max(2026,new Date().getFullYear()))),tab='view',owner=false,editing=null,draft=null;
const $=s=>document.querySelector(s),root=$('#root'),tip=$('#tip');
const WD=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const PRE=[['دراسة','#2563eb'],['إجازة','#f97316'],['اختبارات','#7c3aed'],['وطني','#16a34a'],['مشروع','#0891b2'],['أخرى','#64748b']];
const hf=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
const hm=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{month:'long'});
const gm=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{month:'long'});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const H=d=>{const o={};hf.formatToParts(d).forEach(p=>o[p.type]=p.value);return{d:+o.day,m:+o.month,y:parseInt(o.year)}};
const fmtD=d=>{const h=H(d);return WD[d.getDay()]+' '+d.getDate()+' '+gm.format(d)+' '+d.getFullYear()+' م — '+h.d+' '+hm.format(d)+' '+h.y+' هـ'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const evOn=k=>S.events.filter(e=>!hid.has(e.id)&&e.ranges.some(r=>k>=r[0]&&k<=r[1]));
const rng=e=>e.ranges.map(r=>r[0]===r[1]?r[0]:r[0]+' ← '+r[1]).join(' ، ');

function evPanel(){
  const fd=k=>{const d=new Date(k+'T12:00:00');return d.getDate()+' '+gm.format(d)+' '+d.getFullYear()};
  return `<details class="evp" id="evp"${evOpen?' open':''}><summary>الفعاليات المدرجة (${S.events.length}) — حدّد ما يظهر في التقويم، واضغط على الاسم للانتقال إلى موعده</summary>
  <div class="row" style="margin:10px 0 0"><button class="btn sec" data-vall="1">إظهار الكل</button><button class="btn sec" data-vnone="1">إخفاء الكل</button></div>
  <div class="evl">${S.events.map(e=>`<div class="evi${hid.has(e.id)?' off':''}"><input type="checkbox" data-vis="${e.id}"${hid.has(e.id)?'':' checked'}><i style="background:${e.color}"></i><div style="flex:1;min-width:0"><button class="evn" data-go="${e.id}">${esc(e.title)}</button><small>${e.ranges.map(r=>r[0]===r[1]?fd(r[0]):fd(r[0])+' – '+fd(r[1])).join(' ، ')}</small></div></div>`).join('')}</div></details>`;
}
function goTo(id){
  const e=S.events.find(x=>x.id===id);if(!e||!e.ranges.length)return;
  const rs=[...e.ranges].sort((a,b)=>a[0]<b[0]?-1:1),i=gi[id]=((gi[id]===undefined?-1:gi[id])+1)%rs.length;
  const k=rs[i][0],d=new Date(k+'T12:00:00');
  if(mode==='h'){const y=H(d).y;if(y<1447||y>1452){toast('الموعد خارج نطاق التقويم');return}yh=String(y)}
  else{const y=d.getFullYear();if(y<2026||y>2030){toast('الموعد خارج نطاق التقويم');return}yr=String(y)}
  hid.delete(id);renderView();
  const el=root.querySelector('[data-k="'+k+'"]');
  if(el){el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2400)}
}
document.addEventListener('toggle',e=>{if(e.target.id==='evp')evOpen=e.target.open},true);
function renderView(){
  const groups=[];let cur=null;
  if(!yh)yh=String(Math.min(1452,Math.max(1447,H(new Date()).y)));const hj=mode==='h'&&yh!=='all',y0=mode==='h'?(hj?2025:2026):yr==='all'?2026:+yr,y1=mode==='h'?(hj?2031:2030):yr==='all'?2030:+yr;for(let d=new Date(y0,0,1,12);d<=new Date(y1,11,31,12);d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12)){
    const h=H(d);if(hj&&h.y!==+yh)continue;const key=mode==='h'?h.y+'-'+h.m:d.getFullYear()+'-'+d.getMonth();
    if(!cur||cur.key!==key){cur={key,days:[],title:mode==='h'?hm.format(d)+' '+h.y+' هـ':gm.format(d)+' '+d.getFullYear()+' م'+(mode==='c'?' — '+hm.format(d)+' '+h.y:'')};groups.push(cur)}
    cur.days.push(new Date(d));
  }
  const types=[...new Map(S.events.map(e=>[e.type+e.color,e])).values()];
  const today=iso(new Date()),WL=['أ','ن','ث','ر','خ','ج','س'];
  const cardsHtml=`<div class="months">${groups.map(g=>{const f=g.days[0],h1=H(f);const title=mode==='h'?hm.format(f)+' '+h1.y+' هـ':gm.format(f)+' '+f.getFullYear()+' م'+(mode==='c'?' — '+hm.format(f)+' '+h1.y:'');
    return `<div class="month"><h3>${title}</h3><div class="grid">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}${'<div class="pad"></div>'.repeat(f.getDay())}${g.days.map(d=>{const k=iso(d),h=H(d),hi=mode==='h',ev=evOn(k);return `<div class="day${d.getDay()>4?' we':''}${k===today?' today':''}" data-k="${k}"><b>${hi?h.d:d.getDate()}</b>${mode==='g'?'':`<small>${hi?d.getDate()+'/'+(d.getMonth()+1):h.d}</small>`}<div class="bars">${ev.map(e=>`<span style="background:${e.color}"></span>`).join('')}</div></div>`}).join('')}</div></div>`}).join('')}</div>`;
  const rows=groups.map(g=>{
    const f=g.days[0],l=g.days[g.days.length-1],k0=iso(f),k1=iso(l);
    const evs=S.events.filter(e=>!hid.has(e.id)&&e.ranges.some(r=>r[1]>=k0&&r[0]<=k1));
    const lane={},busy=[];
    evs.forEach(e=>{let n=0;while(busy[n]&&busy[n].some(a=>e.ranges.some(r=>r[0]<=a[1]&&r[1]>=a[0])))n++;(busy[n]=busy[n]||[]).push(...e.ranges);lane[e.id]=n});
    const L=Math.max(1,busy.length),hf1=H(f),hl=H(l);
    const lab=mode==='h'?hm.format(f)+' '+hf1.y+' هـ<br><small>'+gm.format(f)+' ← '+gm.format(l)+' '+l.getFullYear()+'</small>'
      :gm.format(f)+' '+f.getFullYear()+' م<br><small>'+hm.format(f)+' '+hf1.y+' ← '+hm.format(l)+' '+hl.y+' هـ</small>';
    let cells='';
    for(let i=0;i<31;i++){const d=g.days[i];
      if(!d){cells+='<div class="c off"></div>';continue}
      const k=iso(d),h=H(d),hi=mode==='h',ls=Array(L).fill(null);
      evOn(k).forEach(x=>ls[lane[x.id]]=x);
      cells+=`<div class="c${d.getDay()>4?' we':''}${k===today?' today':''}" data-k="${k}"><u>${WL[d.getDay()]}</u><b>${hi?h.d:d.getDate()}</b>${mode==='g'?'':`<i>${hi?d.getDate():h.d}</i>`}${ls.map(x=>`<span class="bar" style="${x?'background:'+x.color:''}"></span>`).join('')}</div>`;
    }
    return `<div class="mrow"><div class="mlab">${lab}</div><div class="cells">${cells}</div></div>`;
  }).join('');
  root.innerHTML=`<div class="bar0"><div class="seg">${[['c','مدمج'],['g','ميلادي'],['h','هجري']].map(([k,n])=>`<button data-m="${k}" class="${mode===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="seg">${[['cards','▦ بطاقات'],['rows','☰ صفوف']].map(([k,n])=>`<button data-l="${k}" class="${lay===k?'on':''}">${n}</button>`).join('')}</div>
  <select id="yr" style="width:auto">${(mode==='h'?['all',1447,1448,1449,1450,1451,1452]:['all',2026,2027,2028,2029,2030]).map(y=>`<option value="${y}"${String(y)===(mode==='h'?yh:yr)?' selected':''}>${y==='all'?(mode==='h'?'كل السنوات الهجرية':'كل السنوات (2026 – 2030)'):'سنة '+y+(mode==='h'?' هـ':' م')}</option>`).join('')}</select><button class="btn sec" id="print" title="تنزيل العام كاملاً بصيغة PDF">🖨️ طباعة PDF</button>
  <div class="legend">${types.map(e=>`<span><i style="background:${e.color}"></i>${esc(e.type)}</span>`).join('')}</div></div>
  ${evPanel()}
  ${lay==='cards'?cardsHtml:`<div class="wrapx"><div class="mwrap">${rows}</div></div>`}`;
}
document.addEventListener('mouseover',e=>{const c=e.target.closest('.c[data-k],.day[data-k]');if(!c){tip.style.display='none';return}
  const d=new Date(c.dataset.k+'T12:00:00'),ev=evOn(c.dataset.k);
  tip.innerHTML='<b>'+fmtD(d)+'</b>'+(ev.length?ev.map(x=>`<div><i style="background:${x.color}"></i>${esc(x.title)} <small>(${esc(x.type)})</small>${x.note?'<br><small>'+esc(x.note)+'</small>':''}</div>`).join(''):'<div style="opacity:.7">لا توجد فعاليات</div>');tip.style.display='block'});
document.addEventListener('mousemove',e=>{if(tip.style.display!=='block')return;let x=e.clientX+14,y=e.clientY+14;if(x+270>innerWidth)x=e.clientX-270;if(y+tip.offsetHeight>innerHeight)y=e.clientY-tip.offsetHeight-10;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px'});

function renderEdit(){
  if(!owner){root.innerHTML='<div class="panel"><h2>🔒 دخول المالك</h2><p style="color:var(--mu);font-size:14px;line-height:1.9;margin-top:0">الإضافة والتعديل والحذف للمالك فقط. أدخل اسم المستودع على GitHub ورمز الوصول (Token) الذي أنشأته لهذا المستودع، ويُحفظ الرمز في متصفحك أنت فقط.</p><label>المستودع (مثال: username/taalam-calendar)</label><input id="gh-repo" dir="ltr" placeholder="username/repo" value="'+esc(guessRepo())+'"><label>رمز الوصول (Fine-grained token)</label><input id="gh-token" type="password" dir="ltr" placeholder="github_pat_..."><div class="row" style="margin-top:14px"><button class="btn" id="login">دخول</button></div></div>';return}
  const d=draft;
  root.innerHTML=`<div style="text-align:left;margin-bottom:8px"><button class="btn sec" id="logout">تسجيل خروج المالك</button></div><div class="panel"><h2>${editing?'تعديل فعالية':'إضافة فعالية'}</h2>
  <label>اسم الفعالية / المهمة</label><input id="f-title" value="${esc(d.title)}">
  <label>النوع واللون</label><div class="chips">${PRE.map(([n,c])=>`<button class="chip" data-pre="${n}|${c}" style="background:${c}">${n}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input id="f-type" value="${esc(d.type)}" placeholder="نوع مخصص"><input type="color" id="f-color" value="${d.color}" style="flex:0 0 56px"></div>
  <label>ملاحظة (اختياري)</label><input id="f-note" value="${esc(d.note||'')}">
  <label>المواعيد (يمكن إضافة فترات غير متسلسلة لنفس المهمة)</label>
  ${d.ranges.map((r,i)=>`<div class="row"><input type="date" data-s="${i}" value="${r[0]}"><input type="date" data-e="${i}" value="${r[1]}"><button class="btn sec" data-rm="${i}">✕</button></div>`).join('')}
  <button class="btn sec" id="addr">＋ إضافة موعد آخر</button>
  <div class="row" style="margin-top:14px"><button class="btn" id="save">${editing?'حفظ التعديل':'إضافة للتقويم'}</button>${editing?'<button class="btn sec" id="cancel">إلغاء</button>':''}</div></div>
  <div class="panel"><h2>الفعاليات الحالية (${S.events.length})</h2>${S.events.map(e=>`<div class="ev"><i style="background:${e.color}"></i><div><b>${esc(e.title)}</b><small>${esc(e.type)} · ${rng(e)}</small></div><button class="btn sec" data-ed="${e.id}">تعديل</button><button class="btn del" data-del="${e.id}">حذف</button></div>`).join('')||'<div class="lock">لا توجد فعاليات</div>'}</div>`;
}
function grab(){if(!$('#f-title'))return;draft.title=$('#f-title').value;draft.type=$('#f-type').value;draft.color=$('#f-color').value;draft.note=$('#f-note').value;
  document.querySelectorAll('[data-s]').forEach(i=>draft.ranges[+i.dataset.s][0]=i.value);document.querySelectorAll('[data-e]').forEach(i=>draft.ranges[+i.dataset.e][1]=i.value)}
const getCreds=()=>{try{return JSON.parse(localStorage.getItem('tl_creds')||'null')}catch(x){return null}};
function guessRepo(){const h=location.hostname,p=location.pathname.split('/')[1];return /\.github\.io$/.test(h)&&p?h.split('.')[0]+'/'+p:''}
const GH=(repo,tok)=>({api:'https://api.github.com/repos/'+repo,hd:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});
async function doLogin(){
  const repo=$('#gh-repo').value.trim(),tok=$('#gh-token').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok){toast('أدخل المستودع والرمز');return}
  try{const g=GH(repo,tok),r=await fetch(g.api,{headers:g.hd});
    if(!r.ok)throw 0;const j=await r.json();if(!(j.permissions&&j.permissions.push))throw 1;
    localStorage.setItem('tl_creds',JSON.stringify({repo,token:tok}));owner=true;draft=draft||fresh();renderEdit();toast('تم تسجيل الدخول')}
  catch(x){toast('تعذّر الدخول: تحقق من المستودع والرمز وصلاحية Contents: Read and write')}
}
async function persist(msg){
  const c=getCreds();if(!c){owner=false;renderEdit();toast('سجّل دخول المالك أولاً');return false}
  const g=GH(c.repo,c.token),url=g.api+'/contents/events.json';
  try{
    let sha;const r=await fetch(url,{headers:g.hd});if(r.ok)sha=(await r.json()).sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify({events:S.events},null,1))));
    const w=await fetch(url,{method:'PUT',headers:g.hd,body:JSON.stringify({message:'تحديث التقويم',content,sha})});
    if(!w.ok)throw 0;
    toast(msg+' — يظهر للجميع خلال دقيقة تقريباً');editing=null;draft=fresh();render();return true;
  }catch(x){toast('تعذّر الحفظ في GitHub');return false}
}
const fresh=()=>({id:'e'+Date.now(),title:'',type:'مشروع',color:'#0891b2',note:'',ranges:[['','']]});
document.addEventListener('click',async e=>{const t=e.target,g=a=>t.closest('['+a+']');
  if(t.dataset.t){tab=t.dataset.t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===t));if(tab==='edit'&&!draft)draft=fresh();render();return}
  if(g('data-m')){mode=g('data-m').dataset.m;renderView();return}
  if(g('data-l')){lay=g('data-l').dataset.l;renderView();return}
  if(g('data-go')){goTo(g('data-go').dataset.go);return}
  if(g('data-vall')){hid.clear();renderView();return}
  if(g('data-vnone')){S.events.forEach(e=>hid.add(e.id));renderView();return}
  if(t.closest('#print')){doPrint();return}
  if(t.id==='login'){doLogin();return}
  if(t.id==='logout'){try{localStorage.removeItem('tl_creds')}catch(x){}owner=false;renderEdit();return}
  if(tab!=='edit'||!owner)return;
  if(g('data-pre')){grab();const[n,c]=g('data-pre').dataset.pre.split('|');draft.type=n;draft.color=c;renderEdit()}
  else if(t.id==='addr'){grab();draft.ranges.push(['','']);renderEdit()}
  else if(g('data-rm')){grab();draft.ranges.splice(+g('data-rm').dataset.rm,1);if(!draft.ranges.length)draft.ranges.push(['','']);renderEdit()}
  else if(g('data-ed')){editing=g('data-ed').dataset.ed;draft=JSON.parse(JSON.stringify(S.events.find(x=>x.id===editing)));renderEdit();scrollTo(0,0)}
  else if(g('data-del')){const b=g('data-del');if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='اضغط للتأكيد';setTimeout(()=>{b.dataset.armed='';b.textContent='حذف'},4000);return}const old=S.events;S.events=S.events.filter(x=>x.id!==b.dataset.del);if(!(await persist('تم الحذف'))){S.events=old;renderEdit()}}
  else if(t.id==='cancel'){editing=null;draft=fresh();renderEdit()}
  else if(t.id==='save'){grab();const rs=draft.ranges.filter(r=>r[0]||r[1]).map(r=>[r[0]||r[1],r[1]||r[0]]);
    if(!draft.title.trim()||!rs.length){toast('أدخل الاسم وموعداً واحداً على الأقل');return}
    if(rs.some(r=>r[1]<r[0])){toast('تاريخ النهاية قبل البداية');return}
    const ev={...draft,title:draft.title.trim(),ranges:rs};
    if(editing)S.events=S.events.map(x=>x.id===editing?ev:x);else S.events.push(ev);await persist('تم الحفظ')}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.vis){const id=e.target.dataset.vis;e.target.checked?hid.delete(id):hid.add(id);renderView();return}if(e.target.id==='yr'){if(mode==='h')yh=e.target.value;else yr=e.target.value;renderView()}});


const WL2=['أ','ن','ث','ر','خ','ج','س'],HF="'Doran','Reem Kufi','Tajawal',sans-serif",BF="'Alyamama','IBM Plex Sans Arabic','Tajawal',sans-serif";
const fdm=k=>{const d=new Date(k+'T12:00:00');return d.getDate()+' '+gm.format(d)};
function pdfHTML(o){
  const md=o.md,lay=o.lay,hj=md==='h',y=o.y;
  const groups=[];let c=null;
  const a=hj?new Date(2025,0,1,12):new Date(y,0,1,12),z=hj?new Date(2031,11,31,12):new Date(y,11,31,12);
  for(let d=a;d<=z;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,12)){const h=H(d);if(hj&&h.y!==y)continue;const key=hj?h.y+'-'+h.m:d.getMonth();if(!c||c.key!==key){c={key,days:[]};groups.push(c)}c.days.push(d)}
  const F=groups[0].days[0],La=groups[groups.length-1].days.slice(-1)[0],hF=H(F),hL=H(La);
  const title=hj?'سنة '+y+' هـ — يوافق '+F.getFullYear()+(La.getFullYear()!==F.getFullYear()?' – '+La.getFullYear():'')+' م':'سنة '+y+' م — يوافق '+hF.y+(hL.y!==hF.y?' – '+hL.y:'')+' هـ';
  const k0=iso(F),k1=iso(La);
  const lbl=g=>{const f=g.days[0],l=g.days[g.days.length-1],h1=H(f),h2=H(l);return hj?[hm.format(f)+' '+h1.y+' هـ',gm.format(f)+' ← '+gm.format(l)]:[gm.format(f)+' '+f.getFullYear()+' م',hm.format(f)+' ← '+hm.format(l)+' '+h2.y+' هـ']};
  let body;
  if(lay==='rows'){
    const rows=groups.map(g=>{
      const f=g.days[0],l=g.days[g.days.length-1],a0=iso(f),a1=iso(l),[l1,l2]=lbl(g);
      const evs=S.events.filter(e=>!hid.has(e.id)&&e.ranges.some(r=>r[1]>=a0&&r[0]<=a1)),lane={},busy=[];
      evs.forEach(e=>{let n=0;while(busy[n]&&busy[n].some(q=>e.ranges.some(r=>r[0]<=q[1]&&r[1]>=q[0])))n++;(busy[n]=busy[n]||[]).push(...e.ranges);lane[e.id]=n});
      const L=Math.max(1,busy.length);let cells='';
      for(let i=0;i<31;i++){const d=g.days[i];
        if(!d){cells+='<td class="off"></td>';continue}
        const k=iso(d),h=H(d),ls=Array(L).fill(null);evOn(k).forEach(x=>ls[lane[x.id]]=x);
        cells+=`<td class="${d.getDay()>4?'we':''}"><div class="L">${WL2[d.getDay()]}</div><div class="N">${hj?h.d:d.getDate()}</div><div class="S">${md==='g'?'&nbsp;':hj?d.getDate():h.d}</div>${ls.map(x=>`<div class="B" style="background:${x?x.color:'transparent'}"></div>`).join('')}</td>`;
      }
      return `<tr><td class="lab">${l1}<br><small>${l2}</small></td>${cells}</tr><tr class="sp"><td colspan="32"></td></tr>`;
    }).join('');
    body=`<table><colgroup><col style="width:150px">${'<col>'.repeat(31)}</colgroup>${rows}</table>`;
  }else{
    body='<div class="cdw">'+groups.map(g=>{const [l1,l2]=lbl(g);
      return `<div class="cdm"><div class="cdh">${l1}<small>${l2}</small></div><div class="cdg">${WD.map(w=>`<div class="cwd">${w}</div>`).join('')}${'<div class="dc nb"></div>'.repeat(g.days[0].getDay())}${g.days.map(d=>{const k=iso(d),h=H(d);
        return `<div class="dc${d.getDay()>4?' we':''}"><b>${hj?h.d:d.getDate()}</b>${md==='g'?'':`<small>${hj?d.getDate():h.d}</small>`}<div class="bb">${evOn(k).map(x=>`<i style="background:${x.color}"></i>`).join('')}</div></div>`}).join('')}</div></div>`}).join('')+'</div>';
  }
  const evl=S.events.filter(e=>!hid.has(e.id)&&e.ranges.some(r=>r[1]>=k0&&r[0]<=k1));
  return `<div class="ph"><img src="${document.querySelector('header .brand img').src}"><div><h1>روزنامة تقويم جمعية تعلَّم - فرع المدينة المنورة</h1><div class="pt">${title}</div></div></div>${body}
  <div class="evs">${evl.map(e=>`<div><i style="background:${e.color}"></i><b>${esc(e.title)}</b> <span>${e.ranges.filter(r=>r[1]>=k0&&r[0]<=k1).map(r=>r[0]===r[1]?fdm(r[0]):fdm(r[0])+' – '+fdm(r[1])).join(' ، ')}</span></div>`).join('')}</div>`;
}

const listY=m=>m==='h'?[1447,1448,1449,1450,1451,1452]:[2026,2027,2028,2029,2030];
const defY=m=>m==='h'?String(yh==='all'||!yh?Math.min(1452,Math.max(1447,H(new Date()).y)):yh):String(yr==='all'?Math.min(2030,Math.max(2026,new Date().getFullYear())):yr);
function doPrint(){
  if(!window.html2canvas||!(window.jspdf&&window.jspdf.jsPDF)){toast('تعذّر تحميل أدوات PDF، حدّث الصفحة وحاول مجدداً');return}
  const P={lay:lay,md:mode,yrs:new Set([defY(mode)])};
  const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);
  const draw=()=>{ov.innerHTML=`<div class="box"><h2>طباعة الروزنامة PDF</h2>
   <label>شكل العرض</label><div class="seg">${[['cards','▦ بطاقات'],['rows','☰ صفوف']].map(([k,n])=>`<button data-pl="${k}" class="${P.lay===k?'on':''}">${n}</button>`).join('')}</div>
   <label>نوع التقويم</label><div class="seg">${[['g','ميلادي'],['h','هجري'],['c','مدمج']].map(([k,n])=>`<button data-pm="${k}" class="${P.md===k?'on':''}">${n}</button>`).join('')}</div>
   <label>الأعوام ${P.md==='h'?'الهجرية':'الميلادية'} (يمكن اختيار عدة أعوام، ولكل عام صفحة)</label><div class="seg">${listY(P.md).map(y=>`<button data-py="${y}" class="${P.yrs.has(String(y))?'on':''}">${y}</button>`).join('')}<button data-pall="1">الكل</button></div>
   <div class="row" style="margin-top:18px"><button class="btn" id="pgo">إنشاء PDF</button><button class="btn sec" id="pcancel">إلغاء</button></div></div>`};
  draw();
  ov.addEventListener('click',async e=>{
    if(e.target===ov){ov.remove();return}
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.pl){P.lay=b.dataset.pl;draw()}
    else if(b.dataset.pm){const was=P.md==='h';P.md=b.dataset.pm;if((P.md==='h')!==was)P.yrs=new Set([defY(P.md)]);draw()}
    else if(b.dataset.py){const y=b.dataset.py;P.yrs.has(y)?P.yrs.delete(y):P.yrs.add(y);draw()}
    else if(b.dataset.pall){const l=listY(P.md).map(String);if(l.every(y=>P.yrs.has(y)))P.yrs.clear();else l.forEach(y=>P.yrs.add(y));draw()}
    else if(b.id==='pcancel')ov.remove();
    else if(b.id==='pgo'){if(!P.yrs.size){toast('اختر عاماً واحداً على الأقل');return}
      ov.querySelectorAll('button').forEach(x=>x.disabled=true);
      await makePDF(P,b);ov.remove()}
  });
}
async function makePDF(P,btn){
  const ys=[...P.yrs].map(Number).sort((a,b)=>a-b),port=P.lay==='cards',ori=port?'portrait':'landscape';
  const pdf=new window.jspdf.jsPDF({orientation:ori,unit:'mm',format:'a4'}),W=port?210:297,Hh=port?297:210,m=6;
  const st=document.createElement('style');st.textContent=PRCSS+PRCSS2;document.head.appendChild(st);
  try{
    for(let i=0;i<ys.length;i++){
      btn.textContent='جارٍ التجهيز '+(i+1)+'/'+ys.length;
      const el=document.createElement('div');el.id='pr';el.className=port?'cd':'';el.innerHTML=pdfHTML({lay:P.lay,md:P.md,y:ys[i]});document.body.appendChild(el);
      try{await Promise.all([document.fonts.load('700 20px "Reem Kufi"'),document.fonts.load('400 14px "IBM Plex Sans Arabic"')])}catch(x){}
      await document.fonts.ready;await new Promise(r=>setTimeout(r,400));
      const cv=await html2canvas(el,{scale:2,backgroundColor:'#fff',onclone:doc=>{doc.getElementById('pr').style.left='0'}});
      el.remove();
      if(i)pdf.addPage('a4',ori);
      let w=W-2*m,h=w*cv.height/cv.width;if(h>Hh-2*m){h=Hh-2*m;w=h*cv.width/cv.height}
      pdf.addImage(cv.toDataURL('image/jpeg',0.93),'JPEG',(W-w)/2,m,w,h);
    }
    const u=URL.createObjectURL(pdf.output('blob')),a=document.createElement('a');
    a.href=u;a.download='روزنامة-تعلم-'+(P.md==='h'?'هجري':P.md==='c'?'مدمج':'ميلادي')+'-'+(ys.length>1?ys[0]+'-'+ys[ys.length-1]:ys[0])+'.pdf';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('تم تجهيز ملف PDF');
  }catch(x){toast('تعذّر إنشاء ملف PDF')}
  finally{st.remove();const p=$('#pr');if(p)p.remove()}
}
